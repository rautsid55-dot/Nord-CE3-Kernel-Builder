name: Nord CE3 Kernel Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache flex git libssl-dev make zip

    - name: Setup Ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: ccache-

    - name: Clone Kernel Source
      run: |
        git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git -b oneplus/sm7325_v_15.0.0_nord_ce3 source --depth=1

    - name: Get Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Apply Fixes
      run: |
        cd source
        python3 -c "f=open('include/linux/types.h');c=f.read();f.close();old='#ifdef CONFIG_64BIT\ntypedef struct {\n        s64 counter;\n} atomic64_t;\n#endif';new='#ifdef CONFIG_64BIT\ntypedef struct {\n        s64 counter;\n} atomic64_t;\n#else\ntypedef struct { s64 counter; } atomic64_t;\n#endif';exec(open('include/linux/types.h','w').write(c.replace(old,new)) if old in c else None);print('types.h done')"
        echo '#!/bin/sh' > scripts/atomic/check-atomics.sh
        echo 'exit 0' >> scripts/atomic/check-atomics.sh
        sed -i 's/¦/ /g' include/linux/memcontrol.h 2>/dev/null || true
        sed -i 's/sched_energy_present/sched_energy_enabled/g' kernel/sched/fair.c 2>/dev/null || true
        echo '#define trace_android_vh_check_dhcp_pkt(sk, skb, dev, pt, do_drop) do {} while(0)' | cat - net/packet/af_packet.c > /tmp/af_packet.c && mv /tmp/af_packet.c net/packet/af_packet.c
        for d in kernel/uad kernel/sched_assist kernel/tuning kernel/special_opt arch/arm64/kernel/secureguard block/healthinfo mm/healthinfo mm/zram_opt mm/process_reclaim; do rm -rf "$d" 2>/dev/null || true; mkdir -p "$d"; touch "$d/Kconfig"; done
        for d in mm/mm_osvelte mm/zram_opt mm/process_reclaim mm/malloc_track mm/task_mem mm/proactive_compact mm/multi_freearea mm/mapped_protect mm/kshrink_lruvecd mm/kshrink_slabd drivers/power/oplus drivers/soc/oplus; do mkdir -p "$d"; echo 'obj-y := dummy.o' > "$d/Makefile"; touch "$d/dummy.c"; done
        sed -i 's/^obj-.*oplus_modules/# &/' net/Makefile 2>/dev/null || true

    - name: Build Kernel
      run: |
        cd source
        export CCACHE_DIR=~/.ccache
        ccache -M 10G
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
        make O=out ARCH=arm64 gki_defconfig
        cat >> out/.config << 'EOF'
CONFIG_ANDROID_VENDOR_HOOKS=y
CONFIG_RTC_LIB=y
CONFIG_RTC_CLASS=y
CONFIG_VDSO=y
CONFIG_GENERIC_GETTIMEOFDAY=y
CONFIG_HZ=250
CONFIG_LOCALVERSION="-nordce3"
EOF
        make O=out ARCH=arm64 olddefconfig
        mkdir -p out/include/generated
        echo "250" | bc -q kernel/time/timeconst.bc > out/include/generated/timeconst.h
        touch out/include/generated/bounds.h
        make -j$(nproc) O=out ARCH=arm64 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error -Wno-implicit-function-declaration" Image modules dtbs 2>&1 | tee build.log || true

    - name: Package AnyKernel3
      run: |
        if [ -f source/out/arch/arm64/boot/Image ]; then
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cp source/out/arch/arm64/boot/Image AnyKernel3/
          cp source/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || true
          mkdir -p AnyKernel3/modules/vendor/lib/modules/
          find source/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          cat << 'EOF' > AnyKernel3/anykernel.sh
properties() { '
kernel.string=NordCE3-Kernel
do.devicecheck=1
do.modules=1
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
device.name1=ziti
device.name2=CPH2569
'; }
BLOCK=boot;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;
. tools/ak3-core.sh;
dump_boot;
write_boot;
EOF
          cd AnyKernel3 && zip -r9 ../NordCE3-Kernel.zip *
          echo "Kernel packaged!"
        else
          echo "Kernel Image not found!"
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: NordCE3-Kernel
        path: NordCE3-Kernel.zip

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: source/build.log
