name: Nord CE3 Kernel Builder v901

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Setup
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex git libssl-dev make zip

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Setup Ccache
      uses: actions/cache@v3
      with:
        path: ~/.ccache
        key: ccache-${{ github.sha }}
        restore-keys: ccache-

    - name: Clone Source
      run: |
        git clone https://github.com/OnePlusOSS/android_kernel_oneplus_sm7325.git -b oneplus/sm7325_v_15.0.0_nord_ce3 source --depth=1

    - name: Get Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain

    - name: Apply Fixes
      run: |
        cd source
        
        # atomic64_t fix
        python3 << 'PYEOF'
with open('include/linux/types.h','r') as f: c=f.read()
old='#ifdef CONFIG_64BIT\ntypedef struct {\n        s64 counter;\n} atomic64_t;\n#endif'
new='#ifdef CONFIG_64BIT\ntypedef struct {\n        s64 counter;\n} atomic64_t;\n#else\ntypedef struct { s64 counter; } atomic64_t;\n#endif'
if old in c: open('include/linux/types.h','w').write(c.replace(old,new))
print("types.h done")
PYEOF

        # check-atomics
        echo '#!/bin/sh' > scripts/atomic/check-atomics.sh
        echo 'exit 0' >> scripts/atomic/check-atomics.sh
        
        # corrupted char
        sed -i 's/¦/ /g' include/linux/memcontrol.h 2>/dev/null
        
        # sched_energy
        sed -i 's/sched_energy_present/sched_energy_enabled/g' kernel/sched/fair.c 2>/dev/null
        
        # vendor hook
        sed -i '1s/^/#define trace_android_vh_check_dhcp_pkt(sk, skb, dev, pt, do_drop) do {} while(0)\n/' net/packet/af_packet.c 2>/dev/null
        
        # Fix symlinks - copy vendor dirs
        for d in kernel/uad kernel/sched_assist kernel/tuning kernel/special_opt arch/arm64/kernel/secureguard block/healthinfo mm/healthinfo mm/zram_opt mm/process_reclaim; do
          rm -rf "$d" 2>/dev/null
          mkdir -p "$d"
          touch "$d/Kconfig" 2>/dev/null
        done
        
        # Missing Makefiles
        for d in mm/mm_osvelte mm/zram_opt mm/process_reclaim mm/malloc_track mm/task_mem mm/proactive_compact mm/multi_freearea mm/mapped_protect mm/kshrink_lruvecd mm/kshrink_slabd; do
          mkdir -p "$d"
          echo 'obj-y := dummy.o' > "$d/Makefile"
          touch "$d/dummy.c"
        done
        
        # Fix net/oplus_modules
        sed -i 's/^obj-.*oplus_modules/# &/' net/Makefile 2>/dev/null
        
        echo "Fixes done"

    - name: Build
      run: |
        cd source
        export CCACHE_DIR=~/.ccache
        ccache -M 10G
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        
        export ARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
        
        make O=out ARCH=arm64 gki_defconfig
        
        cat >> out/.config << 'EOF'
CONFIG_ANDROID_VENDOR_HOOKS=y
CONFIG_RTC_LIB=y
CONFIG_RTC_CLASS=y
CONFIG_VDSO=y
CONFIG_GENERIC_GETTIMEOFDAY=y
CONFIG_HZ=250
CONFIG_LOCALVERSION="-nordce3-custom"
EOF
        
        make O=out ARCH=arm64 olddefconfig
        
        mkdir -p out/include/generated
        echo "250" | bc -q kernel/time/timeconst.bc > out/include/generated/timeconst.h
        touch out/include/generated/bounds.h
        
        make -j$(nproc) O=out ARCH=arm64 \
          CC="ccache clang" \
          LD=ld.lld AR=llvm-ar NM=llvm-nm \
          OBJCOPY=llvm-objcopy STRIP=llvm-strip \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          KCFLAGS="-Wno-error -Wno-implicit-function-declaration" \
          Image modules dtbs 2>&1 | tee build.log || true

    - name: Package
      run: |
        if [ -f source/out/arch/arm64/boot/Image ]; then
          git clone https://github.com/osm0sis/AnyKernel3.git -b master AnyKernel3
          cp source/out/arch/arm64/boot/Image AnyKernel3/
          cp source/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || true
          
          mkdir -p AnyKernel3/modules/vendor/lib/modules/
          find source/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null
          
          cat << 'EOF' > AnyKernel3/anykernel.sh
properties() { '
kernel.string=NordCE3-Lahaina-Kernel
do.devicecheck=1
do.modules=1
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
device.name1=ziti
device.name2=CPH2569
'; }
BLOCK=boot;
IS_SLOT_DEVICE=1;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;
. tools/ak3-core.sh;
dump_boot;
write_boot;
EOF
          
          cd AnyKernel3 && zip -r9 ../NordCE3-Kernel.zip *
          echo "Kernel packaged!"
        else
          echo "Kernel Image not found!"
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NordCE3-Kernel
        path: NordCE3-Kernel.zip

    - name: Upload Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: source/build.log
